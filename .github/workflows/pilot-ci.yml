name: pilot-ci
on:
  pull_request:
    paths: ['pilot/**', 'netlify.toml', '.github/workflows/pilot-ci.yml']
  push:
    branches: ['pilot/**', 'main']
    paths: ['pilot/**', 'netlify.toml', '.github/workflows/pilot-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pilot/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Guard - no real-looking emails or secrets committed under pilot/
        run: |
          set -e
          if grep -rEn --exclude-dir=node_modules --exclude=package-lock.json '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.(com|net|org|us|io|cn|edu|law)\b' . ; then
            echo "Found an email address under pilot/; use *.example.test only"; exit 1; fi
          if grep -rEn --exclude-dir=node_modules 'scrypt\$[0-9]+\$[0-9]+\$[0-9]+\$[A-Za-z0-9+/=]{16,}' . ; then
            echo "Found a password hash under pilot/"; exit 1; fi
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Both come from the same Dockerfile and build cache: the `build` stage carries the
      # compiled test fixtures, the default (last) stage is the production image and has none.
      - run: docker build --target build -t meritx-private-pilot:build pilot
      - run: docker build -t meritx-private-pilot:ci pilot
      - name: destroy-case (compiled JS) in the production image against a fixture data dir
        run: bash pilot/ci/docker-destroy-case.sh meritx-private-pilot:ci meritx-private-pilot:build
